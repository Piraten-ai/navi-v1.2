apiVersion: v1
kind: ConfigMap
metadata:
  name: aads-config
  namespace: aads
data:
  LOG_LEVEL: "INFO"
  ENVIRONMENT: "production"
  INFLUXDB_ORG: "aads"
  INFLUXDB_BUCKET: "aads_metrics"
  MINIO_ENDPOINT: "minio:9000"
---
apiVersion: v1
kind: Secret
metadata:
  name: aads-secrets
  namespace: aads
type: Opaque
stringData:
  DATABASE_URL: "postgresql://aads:CHANGE_ME@postgres:5432/aads"
  INFLUXDB_TOKEN: "CHANGE_ME"
  MINIO_ACCESS_KEY: "CHANGE_ME"
  MINIO_SECRET_KEY: "CHANGE_ME"
  POSTGRES_PASSWORD: "CHANGE_ME"
  INFLUXDB_PASSWORD: "CHANGE_ME"
